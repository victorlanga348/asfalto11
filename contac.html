<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="estilos/style.css">
    <title>Contact</title>
    <script src="https://kit.fontawesome.com/0a0dc4665c.js" crossorigin="anonymous"></script>
</head>
<body class="contact">
    <header class="header-do-menu">
        <img src="imagens/capa-do-site/logo-aasfalto.png" alt="logo do asfalto">
    </header>
    <main class="contacto">
        <div class="horarios">
            <h2>Horarios:</h2>
            <p>Segunda: 9h-19h</p>
            <p>Terca: 9h-19h</p>
            <p>Quarta: Fechado</p>
            <p>Quinta: 9h-19h</p>
            <p>Sexta: 9h-19h</p>
            <p>Sabado: 9h-19h</p>
            <p>Domingo: 12h-19h</p>
        </div>
        <div class="redes-sociais">
            <div class="whatsap redes-especificas">
                <i class="fa-brands fa-whatsapp"></i>
                <p>whatsap</p>
            </div>
            <div class="Facebook redes-especificas">
                <i class="fa-brands fa-facebook"></i>
                <p>Facebook</p>
            </div>
            <div class="instagram redes-especificas">
                <i class="fa-brands fa-instagram"></i>
                <p>instagram</p>
            </div>
        </div>
    </main>

    <footer class="back">
        <a href="index.html"><i class="fa-solid fa-arrow-left"></i></a>
    </footer>
</body>
</html>
